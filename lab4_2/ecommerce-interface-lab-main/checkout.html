<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <title>Checkout & Shipping</title>
  </head>
  <body>
    <a href="cart.html" class="back-btn">← Back</a>
    <section>
      <fieldset class="shipping-address">
        <h2>Shipping Information:</h2>
        <h3>Shipping Address</h3><hr>
        <div>
          <label>Name:</label>
          <input class="input" type="text" placeholder="Ariane Polo" required/>
        </div>
        <div>
          <label>Country:</label>
          <input class="input" type="text" placeholder="Philippines" required/>
        </div>
        <div>
          <label>Province:</label>
          <input class="input" type="text" placeholder="Northern Samar" required/>
        </div>
        <div>
          <label>Municipality:</label>
          <input class="input" type="text" placeholder="Catarman" required/>
        </div>
        <div>
          <label>Street:</label>
          <input class="input" type="text" placeholder="Geronimo" required/>
        </div>
        <div>
          <label>Zip Code:</label>
          <input class="input" type="number" min="6000" placeholder="Zip Code" required/>
        </div>
      </fieldset>

      <div class="payment">
        <h2>Payment Method:</h2>
        <form>
          <input type="radio" name="pay-method" />Credit Card
          <input type="radio" name="pay-method" id="radio-btn"/>Paypal<br />
        </form>

        <aside class="order-sum">
          <h3>Order Summary:</h3>
          <p>Subtotal: &#8369 330</p>
          <p>Shipping: &#8369 50</p>
          <p>Discount: &#8369 0</p>
          <p>Total: &#8369 380</p>
          <p>
            <button class="btn">Place Order</button>
          </p>
        </aside>
      </div>
    </section>
    <script src="solution.js"></script>
  </body>
</html>
