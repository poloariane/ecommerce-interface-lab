<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/detail.css">
    <title>Product Detail View</title>
  </head>
  <body>
    <div class="product-details">
      <a href="products.html" class="back-btn">← Back</a>
      <h2>Product details:</h2>
      <div class="table1">
        <table border=".1">
        <tr>
          <th>Specifications</th>
          <th>Details</th>
        </tr>
        <tr>
          <th>Brand</th>
          <td>Olay</td>
        </tr>
        <tr>
          <th>Color</th>
          <td>white</td>
        </tr>
      </table>
      </div>

      <form class="quantity">
        <label>Quantity:</label>
        <input type="number" value="1" min="1" />
        <button type="button" class="btn" onclick="location.href ='cart.html'">
          Add to Cart
        </button>
      </form>
    </div>

    <section class="user-review">
      <h2 id="user-rw">User Reviews</h2>
      <blockquote>User1: "Very good quality product!"</blockquote>
    </section>
    <script src="solution.js"></script>
  </body>
</html>
