<!doctype html>
<html lang="en">
  <head>

    <header class="account-header">
      <div class="acc-head">
        <h1>My Account</h1>

    <main>

      <section>
        <h2>Previous Purchases:</h2>

        <article class="order-card">

            <summary>Order #001 — ₱380</summary>
            <p>Product 1 - ₱380</p>

        <article class="order-card">
          <details>
            <summary>Order #002 — ₱520</summary>
