<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail View</title>
  </head>
  <body>
    <table border="1">
      <tr>
        <th>Specifications</th>
        <th>Details</th>
      </tr>
      <tr>
        <th>Brand</th>
        <th>Sample Brand</th>
      </tr>
      <tr>
        <th>Color</th>
        <th>Black</th>
      </tr>
    </table>

    <form>
      <label>Quantity:</label>
      <input type="number" value="1" min="1" />
      <button type="submit">Add to Cart</button>
    </form>

    <section>
      <h2>User Reviews</h2>
      <blockquote>"Very good quality product!"</blockquote>
    </section>
  </body>
</html>
